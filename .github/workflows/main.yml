name: Deploy SportMate

on:
  push:
    branches:
      - deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify WAR exists
        run: |
          ls -lah dist
          test -f dist/SportMate.war

      - name: Upload WAR to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASS }}
          source: "dist/SportMate.war"
          target: "C:/deploy/"

      - name: Run deploy script on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASS }}
          request_pty: true
          script: |
            powershell -ExecutionPolicy Bypass -File C:\deploy\deploy.ps1

      - name: Show deploy log hint
        run: |
          echo "If deploy fails, check C:\deploy\deploy.log on the server"
